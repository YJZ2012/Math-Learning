# Project Information
site_name: Math-Learning
site_description: 数学证明与知识库
site_author: YJZ2012
site_url: https://yjz2012.github.io/Math-Learning
strict: false

# Repository
repo_name: 'YJZ2012/Math-Learning'
repo_url: 'https://github.com/YJZ2012/Math-Learning'
edit_uri: 'edit/master/docs/'

# Copyright
copyright: 'Copyright &copy; 2025 Math-Learning'

# Navigation (精简后的核心)
nav:
  - 首页: index.md
  - 数学:
    - 简介: math/index.md
    - 数学归纳法: math/induction.md
    - 数论基础: math/number-theory.md
  - 关于:
    - 关于本站: about.md

# Theme
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换暗色模式
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换亮色模式
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy
  icon:
    logo: material/book-open-page-variant
  favicon: assets/favicon.ico

# Plugins
plugins:
  - search
  - i18n:
      default_language: zh
      languages:
        zh: 中文

# Extensions (Markdown + 数学公式)
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - footnotes
  - attr_list
  - md_in_html

# MathJax (数学渲染)
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
